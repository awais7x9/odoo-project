name: CI Suite

on:
  pull_request:
    # 'synchronize' ensures the check runs every time you push new commits to the same branch
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Odoo Module Check
        run: |
          echo "Simulating Odoo module installation and test run..."
          exit 0

      - name: Check Odoo Module Version
        id: version_check
        run: |
          echo "Checking module version..."
          MODULE_MANIFEST=$(find . -name "__manifest__.py" | head -n 1)

          if [ -z "$MODULE_MANIFEST" ]; then
            echo "No __manifest__.py found!"
            echo "version_error=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract version using sed
          CURRENT_VERSION=$(sed -n "s/.*['\"]version['\"]:[[:space:]]*['\"]\(.*\)['\"].*/\1/p" "$MODULE_MANIFEST")
          
          git fetch origin ${{ github.base_ref }}
          OLD_VERSION=$(git show origin/${{ github.base_ref }}:"$MODULE_MANIFEST" | \
          sed -n "s/.*['\"]version['\"]:[[:space:]]*['\"]\(.*\)['\"].*/\1/p")

          if [ "$CURRENT_VERSION" = "$OLD_VERSION" ]; then
            echo "version_error=true" >> $GITHUB_OUTPUT
          else
            echo "version_error=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Odoo Manifest Warnings
        id: manifest_check
        run: |
          echo "Checking manifest warnings..."
          MANIFEST=$(find . -name "__manifest__.py" | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "manifest_warning=true" >> $GITHUB_OUTPUT
            echo "WARNING_LIST=Manifest file missing" >> $GITHUB_ENV
            exit 0
          fi

          WARNINGS=""

          # 1. Specific Check for the License Key and Value
          # This looks for 'license': 'Other proprietary' (handling quotes and spaces)
          if ! grep -qE "['\"]license['\"][[:space:]]*:[[:space:]]*['\"]Other proprietary['\"]" "$MANIFEST"; then
            WARNINGS="$WARNINGS\n- Missing or incorrect license: must be 'license': 'Other proprietary'"
          fi

          # 2. General check function for other mandatory fields
          check_field () {
            FIELD=$1
            if ! grep -qE "['\"]$FIELD['\"][[:space:]]*:" "$MANIFEST"; then
              WARNINGS="$WARNINGS\n- Missing field: $FIELD"
            fi
          }

          # Validate remaining fields
          check_field "description"
          check_field "author"
          check_field "website"
          check_field "depends"
          check_field "data"

          # Handle the output
          if [ -z "$WARNINGS" ]; then
            echo "No manifest warnings found"
            echo "manifest_warning=false" >> $GITHUB_OUTPUT
          else
            echo -e "Warnings detected:$WARNINGS"
            echo "manifest_warning=true" >> $GITHUB_OUTPUT
            # Use multi-line syntax for GITHUB_ENV
            {
              echo "WARNING_LIST<<EOF"
              echo -e "$WARNINGS"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Create Issue if Version Not Updated
        if: steps.version_check.outputs.version_error == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues \
          -d "{
            \"title\": \"Odoo Module Version Not Updated\",
            \"body\": \"The module version in __manifest__.py was not incremented.\n\nPR: #${{ github.event.pull_request.number }}\",
            \"labels\": [\"ci\",\"odoo\"]
          }"

      - name: Create Issue for Manifest Warnings
        if: steps.manifest_check.outputs.manifest_warning == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues \
          -d "{
            \"title\": \"Odoo Module Manifest Warnings\",
            \"body\": \"The following manifest issues were detected:\n${{ env.WARNING_LIST }}\n\nPR: #${{ github.event.pull_request.number }}\",
            \"labels\": [\"ci\",\"odoo\",\"manifest\"]
          }"
